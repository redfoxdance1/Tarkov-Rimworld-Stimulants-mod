name: RimWorld 1.6 development build

on:
  pull_request:
  push:
    branches:
      - main
      - v0.2-testing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate XML and definitions
        run: python Source_Validation.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile against RimWorld 1.6 reference assemblies
        run: dotnet build Source/TarkovCombatInjectors.csproj --configuration Release

      - name: Package development mod
        shell: pwsh
        run: |
          if (!(Test-Path Assemblies/TarkovCombatInjectors.dll)) { throw 'Missing compiled DLL' }
          New-Item -ItemType Directory -Force -Path dist/TarkovCombatInjectors | Out-Null
          foreach ($folder in @('About', 'Defs', 'Patches', 'Textures')) {
            Copy-Item -Path $folder -Destination dist/TarkovCombatInjectors -Recurse
          }
          New-Item -ItemType Directory -Force -Path dist/TarkovCombatInjectors/Assemblies | Out-Null
          Copy-Item Assemblies/TarkovCombatInjectors.dll dist/TarkovCombatInjectors/Assemblies/

      - name: Upload development mod ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TarkovCombatInjectors-v0.2-testing
          path: dist/
          if-no-files-found: error
