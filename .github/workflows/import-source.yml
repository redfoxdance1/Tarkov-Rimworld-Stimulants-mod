name: Import v0.1 source snapshot
on:
  push:
    paths:
      - 'import/source_text.tar.gz.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate source and placeholder syringe artwork
        run: |
          python -m pip install Pillow==11.3.0
          python tools/import_sources.py
      - name: Commit expanded source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add About Defs Patches Source Textures DesignData.json BUILD_WINDOWS.bat Source_Validation.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: import v0.1 source prototype and injector textures"
            git push
          fi
